services:
  postgres:
    image: postgres:16-alpine
    container_name: frd_postgres
    restart: always
    environment:
      POSTGRES_USER: frd_user
      POSTGRES_PASSWORD: frd_password
      POSTGRES_DB: frd_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frd_user -d frd_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
